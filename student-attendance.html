<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance — DMMMSU SLUC ROTC Unit</title>
<link rel="icon" href="assets/img/dmst-seal.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="dash">
  <aside class="sidebar">
    <div>
      <nav>
        <a href="student-home.html"><span class="icon">🏠</span>HOME</a>
        <a href="student-attendance.html" class="active"><span class="icon">📅</span>ATTENDANCE</a>
        <a href="student-profile.html"><span class="icon">👤</span>PROFILE</a>
        <a href="student-about.html"><span class="icon">ℹ️</span>ABOUT US</a>
      </nav>
    </div>
    <div class="sidebar-footer">
      © JUHAIR D. MORAD<br>BSCS STUDENT<br><br>
      <a href="#" id="logout-link" style="font-weight:700;">Log Out</a>
    </div>
  </aside>

  <div class="dash-main">
    <header class="dash-header">
      <img src="assets/img/dmst-seal.png" alt="seal">
      <h1>DMMMSU SLUC ROTC UNIT</h1>
    </header>

    <main class="content">
      <h2 class="page-title">ATTENDANCE PAGE</h2>

      <div class="qr-box">
        <button class="cam-btn" id="btn-in">Open Camera for Time-In</button>
        <button class="cam-btn" id="btn-out">Open Camera for Time-Out</button>
      </div>

      <div class="qr-result">
        <div id="qr-reader" class="hidden"></div>
        <div id="scan-status" class="form-msg"></div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const user = ROTC.requireRole("student");

document.getElementById("logout-link").addEventListener("click", (e) => {
  e.preventDefault();
  ROTC.clearSession();
  window.location.href = "login.html";
});

let html5QrCode;
let currentMode = null; // "timein" | "timeout"

async function startScan(mode) {
  currentMode = mode;
  const readerDiv = document.getElementById("qr-reader");
  const status = document.getElementById("scan-status");
  readerDiv.classList.remove("hidden");
  status.textContent = "Point the camera at the ROTC attendance QR code…";
  status.className = "form-msg";

  if (html5QrCode) { try { await html5QrCode.stop(); } catch(e){} }
  html5QrCode = new Html5Qrcode("qr-reader");

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess,
      () => {} // ignore per-frame scan errors
    );
  } catch (err) {
    status.textContent = "Could not access camera: " + err;
    status.className = "form-msg error";
  }
}

async function onScanSuccess(decodedText) {
  const status = document.getElementById("scan-status");
  try {
    await html5QrCode.stop();
  } catch (e) {}
  document.getElementById("qr-reader").classList.add("hidden");

  status.textContent = "Recording attendance…";
  try {
    // decodedText is the session token created by the admin (date + type)
    const result = await ROTC.recordAttendance({
      studentId: user.id,
      name: user.name,
      token: decodedText,
      type: currentMode,
    });
    status.textContent = result.message || "Attendance recorded!";
    status.className = "form-msg ok";
  } catch (err) {
    status.textContent = err.message || "Failed to record attendance.";
    status.className = "form-msg error";
  }
}

document.getElementById("btn-in").addEventListener("click", () => startScan("timein"));
document.getElementById("btn-out").addEventListener("click", () => startScan("timeout"));
</script>
</body>
</html>
